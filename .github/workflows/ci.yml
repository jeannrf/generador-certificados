name: CI / Pruebas Automatizadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Verificación, Tests y Build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de tipos TypeScript
        run: npx tsc --noEmit

      - name: Ejecutar pruebas unitarias (Vitest)
        run: npm run test:run

      - name: Compilar aplicación (Vite con Chunks optimizados)
        run: npm run build

      - name: Instalar navegadores Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E (Playwright)
        run: npm run test:e2e
